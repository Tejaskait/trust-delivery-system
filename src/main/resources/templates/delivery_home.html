<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Delivery Feed - Trust Delivery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-dark bg-success mb-4 shadow-sm">
    <div class="container">
        <span class="navbar-brand mb-0 h1"><i class="fas fa-motorcycle me-2"></i> Agent Dashboard</span>
        <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container">
    <h4 class="mb-4">Available Shipments <span class="badge bg-secondary" th:text="${orders.size()}">0</span></h4>

    <div th:if="${orders.isEmpty()}" class="text-center mt-5">
        <i class="fas fa-box-open fa-3x text-muted mb-3"></i>
        <p class="text-muted">No orders available right now. Check back soon!</p>
    </div>

    <div class="row">
        <div th:each="order : ${orders}" class="col-md-6 mb-4">
            <div class="card border-0 shadow-sm h-100">
                <div class="card-body">
                    <div class="d-flex justify-content-between align-items-start">
                        <h5 class="card-title text-primary" th:text="${order.orderName}">Pizza</h5>
                        <span class="badge bg-light text-dark border" th:text="${order.size}">Medium</span>
                    </div>
                    <hr>
                    <p class="mb-2"><strong><i class="fas fa-store text-danger me-2"></i>From:</strong> <span th:text="${order.orderedFrom}">Store</span></p>
                    <p class="mb-3"><strong><i class="fas fa-home text-success me-2"></i>To:</strong> <span th:text="${order.orderedTo}">Address</span></p>
                    
                    <form th:action="@{'/delivery/accept-order/' + ${order.id}}" method="post">
                        <button type="submit" class="btn btn-success w-100 fw-bold">
                            <i class="fas fa-handshake me-2"></i>Accept Delivery
                        </button>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:if="${param.accepted}">
    Swal.fire('Order Accepted!', 'Go to the pickup location immediately.', 'success');
</script>

</body>
</html>
