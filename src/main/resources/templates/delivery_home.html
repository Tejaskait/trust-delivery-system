<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Agent Nexus | Secure Logistics</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-success: #22c55e;
            --accent-blue: #38bdf8;
        }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(at 0% 0%, rgba(34, 197, 94, 0.05) 0px, transparent 50%);
            color: white; font-family: 'Inter', sans-serif; min-height: 100vh;
        }
        .glass-card {
            background: var(--glass); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 20px;
            transition: transform 0.3s ease;
        }
        .glass-card:hover { transform: translateY(-5px); }
        .navbar {
            background: rgba(15, 23, 42, 0.8) !important;
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border);
        }
        .status-pill {
            font-size: 0.7rem; padding: 0.3rem 0.8rem; border-radius: 100px;
            background: rgba(34, 197, 94, 0.1); color: var(--accent-success);
            border: 1px solid rgba(34, 197, 94, 0.2);
        }
        .btn-action {
            background: linear-gradient(135deg, #22c55e, #16a34a);
            border: none; border-radius: 10px; color: white;
            padding: 0.6rem; font-weight: 600;
        }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-5 shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="fas fa-shield-halved me-2 text-success"></i>AGENT NEXUS</span>
        <div class="d-flex align-items-center">
            <span class="text-secondary me-3 small" th:text="${#authentication.name}">Agent</span>
            <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm rounded-pill">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="mb-5" th:if="${myTasks != null and !myTasks.isEmpty()}">
        <h4 class="mb-4 d-flex align-items-center">
            <span class="badge bg-success me-2">LIVE</span> Your Active Deliveries
        </h4>
        <div class="row g-3">
            <div th:each="task : ${myTasks}" class="col-md-6">
                <div class="glass-card p-4">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <h5 class="fw-bold mb-0 text-white" th:text="${task.order.orderName}">Package</h5>
                        <span class="status-pill" th:text="${task.status}">ACCEPTED</span>
                    </div>
                    <p class="text-secondary small mb-4">
                        <i class="fas fa-location-arrow me-2 text-success"></i>
                        <span th:text="${task.order.orderedTo}">Address</span>
                    </p>
                    <a th:href="@{'/order/confirmation/' + ${task.order.id}}" class="btn btn-action w-100 text-decoration-none d-block">    
                        <i class="fas fa-fingerprint me-2"></i>Open Confirmation Hub
                    </a>
                </div>
            </div>
        </div>
    </div>

    <h4 class="text-secondary mb-4"><i class="fas fa-broadcast-tower me-2"></i>Available Dispatch</h4>
    <div class="row g-4">
        <div th:if="${availableOrders.isEmpty()}" class="col-12 text-center py-5 glass-card">
            <p class="text-muted mb-0">Scanning for new delivery requests...</p>
        </div>
        <div th:each="order : ${availableOrders}" class="col-md-4">
            <div class="glass-card p-4 border-0">
                <div class="d-flex justify-content-between mb-2">
                    <h6 class="fw-bold text-white mb-0" th:text="${order.orderName}">Item</h6>
                    <small class="text-info" th:text="${order.size}">Size</small>
                </div>
                <hr class="opacity-10">
                <div class="mb-4 small">
                    <div class="text-secondary mb-1">Pickup: <span class="text-white-50" th:text="${order.orderedFrom}"></span></div>
                    <div class="text-secondary mb-1">Drop-off: <span class="text-white-50" th:text="${order.orderedTo}"></span></div>
                </div>
                <form th:action="@{'/delivery/accept-order/' + ${order.id}}" method="post">
                    <button type="submit" class="btn btn-outline-success w-100 rounded-pill">Accept Mission</button>
                </form>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:if="${param.accepted}">
    Swal.fire({
        background: '#0f172a', color: '#fff',
        icon: 'success', title: 'Mission Accepted',
        text: 'Proceed to the handoff hub for verification.',
        confirmButtonColor: '#22c55e'
    });
</script>
</body>
</html>
