<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Dashboard - Trust Delivery</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
    <style>
        body { background-color: #f8f9fa; }
        .card { border: none; border-radius: 15px; }
        .btn-success { border-radius: 10px; padding: 10px 20px; font-weight: 600; }
        .form-control { border-radius: 8px; border: 1px solid #ddd; }
        .order-list-card { transition: transform 0.2s; }
        .order-list-card:hover { transform: translateY(-3px); }
    </style>
</head>
<body>

<nav class="navbar navbar-dark bg-primary mb-4 shadow-sm">
    <div class="container">
        <span class="navbar-brand mb-0 h1"><i class="fas fa-truck-fast me-2"></i> Trust Delivery</span>
        <a th:href="@{/logout}" class="btn btn-outline-light btn-sm">Logout</a>
    </div>
</nav>

<div class="container">
    <div class="row justify-content-center">
        <div class="col-lg-7">
            <div class="card shadow-sm p-4 mb-5">
                <div class="d-flex align-items-center mb-4">
                    <div class="bg-primary text-white rounded-circle p-3 me-3">
                        <i class="fas fa-shopping-basket fa-lg"></i>
                    </div>
                    <div>
                        <h3 class="mb-0">Place New Order</h3>
                        <small class="text-muted">Enter details below to find a delivery agent</small>
                    </div>
                </div>

                <form th:action="@{/customer/place-order}" method="post">
                    <div class="row mt-3">
                        <div class="col-md-8 mb-3">
                            <label class="form-label fw-bold">Item Name</label>
                            <input type="text" name="orderName" class="form-control" placeholder="What are we delivering?" required>
                        </div>
                        <div class="col-md-4 mb-3">
                            <label class="form-label fw-bold">Size</label>
                            <input type="text" name="size" class="form-control" placeholder="e.g. Small/2KG">
                        </div>
                    </div>

                    <div class="mb-3">
                        <label class="form-label fw-bold">Pickup Location</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-map-marker-alt text-danger"></i></span>
                            <input type="text" name="orderedFrom" class="form-control border-start-0" placeholder="Store or House address" required>
                        </div>
                    </div>

                    <div class="mb-4">
                        <label class="form-label fw-bold">Delivery Destination</label>
                        <div class="input-group">
                            <span class="input-group-text bg-white"><i class="fas fa-location-arrow text-primary"></i></span>
                            <input type="text" name="orderedTo" class="form-control border-start-0" placeholder="Your address" required>
                        </div>
                    </div>

                    <button type="submit" class="btn btn-success w-100 shadow-sm">
                        <i class="fas fa-check-circle me-2"></i>Confirm & Post Order
                    </button>
                </form>
            </div>
            
            <div class="mb-5">
                <h4 class="text-secondary mb-3"><i class="fas fa-list-check me-2"></i> Your Active Orders</h4>
                
                <div th:if="${myOrders == null or myOrders.isEmpty()}" class="text-center py-4 bg-white rounded shadow-sm">
                    <p class="text-muted mb-0 italic">No orders placed yet. Start by filling the form above!</p>
                </div>

                <div th:each="order : ${myOrders}" class="card order-list-card shadow-sm mb-3 border-0">
                    <div class="card-body d-flex justify-content-between align-items-center">
                        <div>
                            <h5 class="fw-bold mb-1" th:text="${order.orderName}">Package Name</h5>
                            <div class="d-flex gap-2 align-items-center">
                                <span class="badge bg-info text-dark" th:text="${order.status}">Status</span>
                                <small class="text-muted"><i class="fas fa-calendar-alt me-1"></i> <span th:text="${#temporals.format(order.createdAt, 'dd MMM, HH:mm')}"></span></small>
                            </div>
                        </div>
                        
                        <a th:href="@{'/order/confirmation/' + ${order.id}}" class="btn btn-outline-primary btn-sm px-3">
                            View Details <i class="fas fa-arrow-right ms-1"></i>
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script th:if="${param.orderSuccess}">
    Swal.fire({
        title: 'Order Placed!',
        text: 'Your order has been posted. Delivery agents can now see it!',
        icon: 'success',
        confirmButtonColor: '#0d6efd',
        confirmButtonText: 'Great!'
    });
</script>

</body>
</html>
