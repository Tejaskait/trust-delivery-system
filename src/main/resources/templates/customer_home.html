<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Customer Hub | Trust Delivery</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --bg-dark: #0f172a;
            --glass: rgba(255, 255, 255, 0.03);
            --glass-border: rgba(255, 255, 255, 0.08);
            --accent-blue: #38bdf8;
            --accent-purple: #818cf8;
        }
        body {
            background-color: var(--bg-dark);
            background-image: radial-gradient(at 100% 0%, rgba(56, 189, 248, 0.07) 0px, transparent 50%);
            color: white; font-family: 'Inter', sans-serif; min-height: 100vh;
        }
        .glass-card {
            background: var(--glass); backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border); border-radius: 20px;
        }
        .navbar {
            background: rgba(15, 23, 42, 0.8) !important;
            backdrop-filter: blur(10px); border-bottom: 1px solid var(--glass-border);
        }
        .form-control, .input-group-text {
            background: rgba(255, 255, 255, 0.05) !important;
            border: 1px solid var(--glass-border) !important;
            color: white !important; border-radius: 12px;
        }
        .form-control:focus {
            border-color: var(--accent-blue) !important;
            box-shadow: 0 0 0 0.25rem rgba(56, 189, 248, 0.1);
        }
        .btn-submit {
            background: linear-gradient(135deg, var(--accent-blue), var(--accent-purple));
            border: none; border-radius: 12px; color: white;
            padding: 0.8rem; font-weight: 700; text-transform: uppercase; letter-spacing: 1px;
            transition: all 0.3s ease;
        }
        .btn-submit:hover {
            transform: scale(1.02); opacity: 0.9;
        }
        .status-pill {
            font-size: 0.7rem; padding: 0.3rem 0.8rem; border-radius: 100px;
            background: rgba(56, 189, 248, 0.1); color: var(--accent-blue);
            border: 1px solid rgba(56, 189, 248, 0.2);
        }
        .order-row {
            transition: all 0.3s ease; border-bottom: 1px solid var(--glass-border);
        }
        .order-row:hover { background: rgba(255, 255, 255, 0.02); }
    </style>
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark mb-5 shadow-sm">
    <div class="container">
        <span class="navbar-brand fw-bold"><i class="fas fa-truck-fast me-2 text-info"></i>TRUST DELIVERY</span>
        <div class="d-flex align-items-center">
            <span class="text-secondary me-3 small">Welcome, <span th:text="${#authentication.name}">Customer</span></span>
            <a th:href="@{/logout}" class="btn btn-outline-danger btn-sm rounded-pill px-3">Logout</a>
        </div>
    </div>
</nav>

<div class="container">
    <div class="row g-5">
        <div class="col-lg-5">
            <div class="glass-card p-4 sticky-top" style="top: 100px;">
                <h4 class="mb-4 d-flex align-items-center">
                    <i class="fas fa-plus-circle me-2 text-info"></i> Dispatch New Package
                </h4>
                <form th:action="@{/customer/place-order}" method="post">
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Package Contents</label>
                        <input type="text" name="orderName" class="form-control" placeholder="Ex: Medical Supplies" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Dimensions/Weight</label>
                        <input type="text" name="size" class="form-control" placeholder="Ex: 5kg / Small Box">
                    </div>
                    <div class="mb-3">
                        <label class="form-label small text-secondary">Pickup Point</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-map-pin"></i></span>
                            <input type="text" name="orderedFrom" class="form-control" placeholder="Enter source address" required>
                        </div>
                    </div>
                    <div class="mb-4">
                        <label class="form-label small text-secondary">Target Destination</label>
                        <div class="input-group">
                            <span class="input-group-text"><i class="fas fa-location-dot"></i></span>
                            <input type="text" name="orderedTo" class="form-control" placeholder="Enter drop-off address" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-submit w-100">
                        Initiate Protocol
                    </button>
                </form>
            </div>
        </div>

        <div class="col-lg-7">
            <h4 class="text-secondary mb-4 d-flex justify-content-between align-items-center">
                <span><i class="fas fa-layer-group me-2"></i>Mission History</span>
                <span class="badge bg-dark border border-secondary fw-light" style="font-size: 0.8rem;" th:text="${myOrders.size() + ' Active'}">0 Active</span>
            </h4>

            <div th:if="${myOrders.isEmpty()}" class="glass-card p-5 text-center">
                <i class="fas fa-box-open fa-3x text-secondary mb-3 opacity-25"></i>
                <p class="text-muted">No active missions found in your secure history.</p>
            </div>

            <div th:each="order : ${myOrders}" class="glass-card mb-3 overflow-hidden">
                <div class="p-4 order-row">
                    <div class="d-flex justify-content-between align-items-start mb-3">
                        <div>
                            <h5 class="fw-bold text-white mb-1" th:text="${order.orderName}">Package</h5>
                            <small class="text-info opacity-75" th:text="${order.size}">Size</small>
                        </div>
                        <span class="status-pill" th:text="${order.status}">PENDING</span>
                    </div>
                    
                    <div class="row g-2 mb-4">
                        <div class="col-6">
                            <div class="small text-secondary text-uppercase" style="font-size: 0.6rem;">Origin</div>
                            <div class="small text-white-50 text-truncate" th:text="${order.orderedFrom}">Address</div>
                        </div>
                        <div class="col-6">
                            <div class="small text-secondary text-uppercase" style="font-size: 0.6rem;">Destination</div>
                            <div class="small text-white-50 text-truncate" th:text="${order.orderedTo}">Address</div>
                        </div>
                    </div>

                    <div class="d-flex justify-content-between align-items-center">
                        <small class="text-secondary">
                            <i class="far fa-clock me-1"></i> 
                            <span th:text="${#temporals.format(order.createdAt, 'dd MMM, HH:mm')}">Time</span>
                        </small>
                        <a th:href="@{'/order/confirmation/' + ${order.id}}" class="btn btn-sm btn-outline-info rounded-pill px-4">
                            Track Pulse
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
<script th:if="${param.orderSuccess}">
    Swal.fire({
        background: '#0f172a', color: '#fff',
        icon: 'success', title: 'Mission Logged',
        text: 'Your delivery request is now broadcasting to available agents.',
        confirmButtonColor: '#38bdf8'
    });
</script>

</body>
</html>
